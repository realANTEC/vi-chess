[project]
name = "vi-chess"
version = "0.1.0"
description = "Multi-universe chess engine prototype. Tests whether ensemble diversity beats single-eval at equal compute."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Vanshdeep Singh Kohli", email = "vanshdeep08kohli@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
    "scikit-learn>=1.8.0",
]

[project.scripts]
vi-chess = "vi_chess:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: deeper perft / longer experiments (deselect with -m 'not slow')",
]
